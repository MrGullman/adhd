name: tests

on:
  push:
    branches:
      - main
      - 'milestone-*'
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: npf_familjen_test
          MARIADB_USER: npf_familjen
          MARIADB_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: npf_familjen_test
      DB_USERNAME: npf_familjen
      DB_PASSWORD: secret
      DB_COLLATION: utf8mb4_uca1400_swedish_ai_ci

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Use Swedish collation in the test database
        run: >-
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e
          "ALTER DATABASE npf_familjen_test CHARACTER SET utf8mb4 COLLATE utf8mb4_uca1400_swedish_ai_ci"

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
