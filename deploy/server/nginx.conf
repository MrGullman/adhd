# /etc/nginx/sites-available/npf-familjen
# HTTPS läggs till av Certbot (certbot --nginx). Se docs/DRIFT.md.

server {
    listen 80;
    listen [::]:80;
    server_name npf-familjen.duckdns.org;

    root /var/www/npf-familjen/current/public;
    index index.php;
    charset utf-8;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Byggd frontend med versionsnummer i filnamnen kan cachas länge.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/npf-familjen.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Room for the app's response headers (cookies); the default 4k is too small.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
