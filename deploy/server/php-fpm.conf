; /etc/php/8.4/fpm/pool.d/npf-familjen.conf
; Appen körs som användaren npf-familjen, som också äger filerna. Då behövs inga särskilda rättigheter.

[npf-familjen]
user = npf-familjen
group = npf-familjen

listen = /run/php/npf-familjen.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 20M
php_admin_flag[expose_php] = off
